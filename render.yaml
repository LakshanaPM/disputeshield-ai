# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo to Render and it auto-provisions everything

databases:
  - name: disputeshield-db
    plan: free
    databaseName: disputeshield
    user: disputeshield

services:
  # --- FastAPI Backend ---
  - type: web
    name: disputeshield-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: |
      cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: disputeshield-db
          property: connectionString
      - key: PYTHONPATH
        value: .
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true

  # --- React Frontend ---
  - type: web
    name: disputeshield-frontend
    runtime: static
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://disputeshield-api-1p7w.onrender.com
      - key: VITE_WS_URL
        value: wss://disputeshield-api-1p7w.onrender.com/ws
